name: Build and deploy Junteng Liu's homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check rendered content
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          titles=(
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond"
            "On the Perception Bottleneck of VLMs for Chart Understanding"
            "On the Universal Truthfulness Hyperplane Inside LLMs"
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
            "Composing Parameter-Efficient Modules with Arithmetic Operations"
          )
          for title in "${titles[@]}"; do
            grep -Fq "$title" _site/index.html
            grep -Fq "$title" _site/publications/index.html
          done
      - name: Check GitHub Pages availability
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" && [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The site builds successfully. Enable GitHub Pages with GitHub Actions as the source to publish it."
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
